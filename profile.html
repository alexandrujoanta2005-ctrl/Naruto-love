<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Naruto Quiz">
<title>Profil Ninja</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./style.css?v=9">
</head>
<body>

<main class="app">
  <header class="topbar"><div class="brand"><small>👤 NINJA</small><h1>Profilul tău</h1></div></header>

  <section class="card">
    <div class="profile-form">
      <div class="field"><label>NUME NINJA</label><input id="ninjaName" maxlength="24" placeholder="Shinobi"></div>
      <div class="field"><label>SAT</label>
        <select id="village"><option>Frunza</option><option>Nisip</option><option>Ceață</option><option>Nor</option><option>Piatră</option><option>Ploaie</option></select>
      </div>
      <div class="field"><label>CLAN</label>
        <select id="clan"><option>Independent</option><option>Uzumaki</option><option>Uchiha</option><option>Hyuga</option><option>Nara</option><option>Yamanaka</option><option>Akimichi</option><option>Aburame</option><option>Inuzuka</option></select>
      </div>
      <button id="saveProfile" class="primary-btn" type="button">Salvează profilul</button>
    </div>
  </section>

  <section class="card">
    <h3>Statistici</h3>
    <div class="stats">
      <div class="stat"><strong id="pRank">Student</strong><span>RANG</span></div>
      <div class="stat"><strong id="pXP">0</strong><span>XP</span></div>
      <div class="stat"><strong id="pCorrect">0</strong><span>CORECTE</span></div>
      <div class="stat"><strong id="pAnswered">0</strong><span>RĂSPUNSURI</span></div>
    </div>
  </section>

  <section class="card"><button id="resetProfile" class="danger-btn" type="button">Resetează progresul</button></section>
</main>

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const n=document.getElementById("ninjaName"),v=document.getElementById("village"),c=document.getElementById("clan");
  function load(){
    const p=NinjaApp.getProfile();
    n.value=p.ninjaName;v.value=p.village;c.value=p.clan;
    document.getElementById("pRank").textContent=p.rank;
    document.getElementById("pXP").textContent=p.xp;
    document.getElementById("pCorrect").textContent=p.quizCorrect||0;
    document.getElementById("pAnswered").textContent=p.quizAnswered||0;
  }
  document.getElementById("saveProfile").addEventListener("click",()=>{
    const p=NinjaApp.getProfile();
    p.ninjaName=n.value.trim()||"Shinobi";p.village=v.value;p.clan=c.value;
    NinjaApp.saveProfile(p);alert("Profil salvat 🥷");load();
  });
  document.getElementById("resetProfile").addEventListener("click",()=>{
    if(confirm("Resetezi tot progresul?")){
      localStorage.removeItem("ninjaProfile");
      localStorage.removeItem("ninjaDailyMissions");
      load();
    }
  });
  load();
});
</script>


<nav class="bottom-nav">
  <button type="button" class="nav-item " data-page="index.html"><span class="nav-icon">🏠</span><span>Sat</span></button>
  <button type="button" class="nav-item " data-page="missions.html"><span class="nav-icon">⚔️</span><span>Misiuni</span></button>
  <button type="button" class="nav-item " data-page="quiz.html"><span class="nav-icon">❓</span><span>Quiz</span></button>
  <button type="button" class="nav-item " data-page="jutsu.html"><span class="nav-icon">🌀</span><span>Jutsu</span></button>
  <button type="button" class="nav-item active" data-page="profile.html"><span class="nav-icon">👤</span><span>Ninja</span></button>
</nav>

<script src="./app.js?v=9"></script>
</body>
</html>
